# Defaults for Streamlit's own widgets. The app ships two designed palettes and
# a Display toggle in the sidebar; these values match the dark one so the native
# chrome agrees with the default choice on first paint.
[theme]
base = "dark"
primaryColor = "#D9481F"
backgroundColor = "#141719"
secondaryBackgroundColor = "#1D2124"
textColor = "#E7EAEC"

[client]
toolbarMode = "minimal"
